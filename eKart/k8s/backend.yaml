apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: ekart-backend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8081

          # Startup Probe
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 30
            periodSeconds: 10

          # Liveness Probe
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 10

          # Readiness Probe
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 5

          env:
            # MongoDB configuration from ConfigMap
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: ekart-config
                  key: SPRING_DATA_MONGODB_URI

            # Environment configuration from ConfigMap
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: ekart-config
                  key: ENVIRONMENT

            # Razorpay credentials from Kubernetes Secret
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: razorpay-secret
                  key: RAZORPAY_KEY_ID

            - name: RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: razorpay-secret
                  key: RAZORPAY_KEY_SECRET

---
apiVersion: v1
kind: Service
metadata:
  name: backend

spec:
  selector:
    app: backend

  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8081

  type: ClusterIP